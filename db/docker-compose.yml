# Local SQL Server for testing schema/data changes before pushing.
# Usage: npm run db:up

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: talentscope-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TalentScope_Local_Dev1!}"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - talentscope_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  talentscope_mssql_data:
