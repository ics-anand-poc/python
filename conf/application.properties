# Shared profile settings. Supply secret values through the runtime environment.
# Secret values should be supplied as environment variables, not committed.
app.profile=local

database.local.type=mssql
database.local.host=${MSSQL_LOCAL_SERVER}
database.local.port=${MSSQL_LOCAL_PORT}
database.local.database=${MSSQL_LOCAL_DATABASE}
database.local.user=${MSSQL_LOCAL_USER}
database.local.password=${MSSQL_LOCAL_PASSWORD}
database.local.encrypt=true
database.local.trust_certificate=true
database.local.driver=ODBC Driver 18 for SQL Server

database.vercel.type=postgres
database.vercel.host=${SUPABASE_DB_HOST}
database.vercel.port=${SUPABASE_DB_PORT}
database.vercel.database=${SUPABASE_DB_NAME}
database.vercel.user=${SUPABASE_DB_USER}
database.vercel.password=${SUPABASE_DB_PASSWORD}
database.vercel.sslmode=require

database.production.type=mssql
database.production.host=${MSSQL_PRODUCTION_SERVER}
database.production.port=${MSSQL_PRODUCTION_PORT
database.production.database=${MSSQL_PRODUCTION_DATABASE}
database.production.user=${MSSQL_PRODUCTION_USER}
database.production.password=${MSSQL_PRODUCTION_PASSWORD}
database.production.encrypt=true
database.production.trust_certificate=true
database.production.driver=ODBC Driver 18 for SQL Server

NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
NEXT_PUBLIC_SUPABASE_ANON_KEY=${}
